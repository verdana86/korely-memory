[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korely-memory"
version = "0.1.4"
description = "Python SDK for Korely Agents — memory for AI agents with bi-temporal typed facts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Korely" }]
keywords = ["ai", "agents", "memory", "llm", "rag", "knowledge-graph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Zero runtime dependencies — a thin client over stdlib urllib.
dependencies = []

[project.optional-dependencies]
# `pip install korely-memory[mcp]` adds the stdio MCP server (`korely-mcp`) so a
# coding assistant (Claude Code, Cursor, Windsurf, …) gets Korely memory as MCP
# tools. The base SDK stays zero-dependency; only this extra pulls `mcp`.
mcp = ["mcp>=1.2.0"]

[project.scripts]
korely = "korely_memory.cli:main"
korely-mcp = "korely_memory.mcp_server:main"

[project.urls]
Homepage = "https://korely.ai/agents"
Repository = "https://github.com/verdana86/korely-memory"
Source = "https://github.com/verdana86/korely-memory/tree/main/python"
"Issue Tracker" = "https://github.com/verdana86/korely-memory/issues"
Documentation = "https://korely.ai/agents/docs/surfaces/sdk"
"API Reference" = "https://korely.ai/agents/docs/api-reference"

[tool.hatch.build.targets.wheel]
packages = ["korely_memory"]
