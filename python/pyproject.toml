[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korely-memory"
version = "0.1.15"
description = "Python SDK for Korely Agents: memory for AI agents with bi-temporal typed facts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Korely" }]
keywords = ["ai", "agents", "memory", "llm", "rag", "knowledge-graph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Zero runtime dependencies: a thin client over stdlib urllib.
dependencies = []

[project.optional-dependencies]
# The stdio MCP server (`korely-mcp`) needs nothing since 0.1.16: the protocol
# is implemented with the standard library (korely_memory/_mcp_stdio.py), so it
# runs on the Python 3.9 macOS ships. It used to pull `mcp`, which needs 3.10,
# and whose 2.0 removed the module the server imported. The extra stays, empty,
# so `pip install 'korely-memory[mcp]'` in existing docs keeps working.
mcp = []
# korely_memory.integrations.langgraph: a LangGraph store, two tools and a
# context helper. Only that module imports these, so the core package keeps
# zero dependencies and Python 3.9; LangGraph itself needs Python 3.10. Capped
# below the next major version, the lesson of mcp 2.0 above.
langgraph = ["langgraph>=1.0,<2", "langchain-core>=1.0,<2"]

[project.scripts]
korely = "korely_memory.cli:main"
korely-mcp = "korely_memory.mcp_server:main"

[project.urls]
Homepage = "https://korely.ai/agents"
Repository = "https://github.com/verdana86/korely-memory"
Source = "https://github.com/verdana86/korely-memory/tree/main/python"
"Issue Tracker" = "https://github.com/verdana86/korely-memory/issues"
Documentation = "https://korely.ai/agents/docs/surfaces/sdk"
"API Reference" = "https://korely.ai/agents/docs/api-reference"

[tool.hatch.build.targets.wheel]
packages = ["korely_memory"]
